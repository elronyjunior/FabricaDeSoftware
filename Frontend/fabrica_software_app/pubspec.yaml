name: fabrica_software_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Ícones e UI
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.9.1
  flutter_svg: ^2.2.2

  # Gerenciamento de Estado e Rotas
  provider: ^6.1.5
  go_router: ^16.3.0

  # Conectividade e Armazenamento
  http: ^1.5.0
  shared_preferences: ^2.5.3
  
  # Firebase e Autenticação
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  google_sign_in: ^7.2.0

  # Internacionalização e Utilitários
  slang: ^3.31.0
  slang_flutter: ^3.31.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # Assets (Imagens e SVGs)
  assets:
    - assets/image/
    - assets/SVG/